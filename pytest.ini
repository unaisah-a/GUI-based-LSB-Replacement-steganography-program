[pytest]
# `tests` is on the import path so conftest helpers can be imported by name, and
# the repository root is on it so `app` resolves without an installed package.
pythonpath = . tests
testpaths = tests
# PySide6 6.8/pytest-qt 4.4 on Windows crashed with Qt log capture enabled;
# disabling that capture passed repeated GUI and full-suite checks (T08).
# Keep Qt's native stderr logging; retain all tests and exception capture.
addopts = -ra --strict-markers --no-qt-log
filterwarnings =
    error
    # Hypothesis emits this when a test function is slow rather than incorrect.
    default::hypothesis.errors.NonInteractiveExampleWarning
